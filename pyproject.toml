[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "suffolklitlab-macourts"
version = "0.1.0"
description = "Dependency-light Massachusetts court lookup and jurisdiction matching"
requires-python = ">=3.10"
dependencies = ["shapely>=2.0.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["macourts*"]

[tool.setuptools.package-data]
macourts = ["data/*.json", "data/*.geojson", "data/*.sqlite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
